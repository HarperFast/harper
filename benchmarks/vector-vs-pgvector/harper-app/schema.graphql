# SIFT vector table. The embedding is HNSW-indexed with euclidean distance to match the
# corpus (SIFT descriptors are compared under L2) and pgvector's vector_l2_ops index.
#
# M and efConstruction are set explicitly rather than left to defaults so both systems build
# structurally comparable graphs — pgvector defaults to ef_construction 64, Harper to 100.
type items @table @export {
	id: ID @primaryKey
	embedding: [Float] @indexed(type: "HNSW", distance: "euclidean", M: "16", efConstruction: "100")
}
