# Backing services for the Postgres + Redis comparison stack.
# Host networking so the client/server hop is loopback on both sides of the
# comparison (Harper also runs on the host) — no docker-proxy / NAT in the path.
services:
  postgres:
    image: postgres:17-alpine
    network_mode: host
    environment:
      POSTGRES_PASSWORD: ycsb
      POSTGRES_USER: ycsb
      POSTGRES_DB: ycsb
      PGPORT: '5433'
    # Durability left at the default (fsync=on, synchronous_commit=on) to match
    # Harper's default storage.writeAsync=false. Only memory sizing is tuned,
    # since the stock 128MB shared_buffers would make this a page-fault benchmark.
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=16GB
      - -c
      - max_connections=300
      - -c
      - max_wal_size=8GB
    shm_size: 2gb
    # Real disk, not tmpfs. On tmpfs an fsync is a no-op, so Postgres would pay
    # nothing for synchronous_commit while Harper still paid real LSM compaction
    # — which silently tilts every write-bearing workload. The bind mount must
    # land on the same filesystem as the Harper data directory (run-compare.mts
    # puts both under YCSB_VS_PG_DATA_DIR and asserts they share a device).
    volumes:
      - ${YCSB_VS_PG_DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    network_mode: host
    # Cache role: no persistence, LRU eviction, generous memory.
    command:
      - redis-server
      - --port
      - '6380'
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 8gb
      - --maxmemory-policy
      - allkeys-lru
