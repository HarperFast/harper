name: reloadMarker flake debug (temporary)

# Throwaway: repeats the LMDB resources suite to catch harper#4506 with diagnostics. Not for main.
on:
  push:
    branches: [debug/reload-marker-flake]

permissions:
  contents: read

jobs:
  lmdb-resources:
    name: LMDB resources (${{ matrix.slot }}, Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          check-latest: ${{ matrix.node-version == 26 }}
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'
        run: node ./dist/bin/harper.js install
      - name: Repeat the LMDB resources suite
        shell: bash {0}
        run: |
          mkdir -p logs
          for i in 1 2 3 4; do
            HARPER_STORAGE_ENGINE=lmdb npx mocha "unitTests/resources/**/*.js" --exclude "unitTests/resources/**/*.bench.js" > logs/run-$i.log 2>&1
            code=$?
            echo "run $i exit $code reloadMarker failures: $(grep -cE '^\s+[0-9]+\) table-reload marker' logs/run-$i.log)"
            grep -E '^\s+[0-9]+ (passing|failing)' logs/run-$i.log
            grep -E '^\s+[0-9]+\) ' logs/run-$i.log | head -20
            grep -B2 -A16 '^DIAG' logs/run-$i.log
            cp -r unitTests/envDir logs/envDir-$i 2>/dev/null
            rm -rf unitTests/envDir/*
          done
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-${{ matrix.slot }}-${{ matrix.node-version }}
          path: logs
          retention-days: 7
