name: Format Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          # .node-version holds only the major; without this, setup-node uses whatever release of that major the runner has cached.
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run format check
        run: npm run format:check
