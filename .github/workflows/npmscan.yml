name: npmscan

# Diffs package.json / package-lock.json against the PR base with npmscan.com and
# flags known malware, new install scripts, changed tarball URLs or integrity
# hashes, and changed overrides. Warn-only: it never fails the check, so the path
# filter is safe. Don't make it a required check without dropping the filter, or
# PRs that skip it stay pending forever. See harper#666.

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  scan:
    name: npmscan dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # for the one report comment; fork PRs get a read-only token and use the job summary
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependency changes
        timeout-minutes: 7
        uses: NPMscan/npmscan-action@de14168f65640a4ed1f0e82ad3ad8c80483d360d # v1.3.0
        with:
          file: package-lock.json
          mode: warn
          fail-on-error: false
