name: Docs

# Builds the documentation site (HarperFast/documentation) with this PR's docs/ in place of
# main's, so a broken link, import or MDX error fails the PR instead of the next site deploy.
# The site assembles docs/ from harper and harper-pro, and redeploys by itself after docs/
# changes on main.

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harper
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HarperFast/documentation
          path: site
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        env:
          HARPER_DOCS_PATH: ${{ github.workspace }}/harper
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/build
          retention-days: 14
