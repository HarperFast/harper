name: Publish NPM Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v5.1.0-beta.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-harper-npm-package:
    runs-on: ubuntu-latest
    outputs:
      harper-version: ${{ steps.version-components.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Get release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: gh release download "$TAG_NAME" --pattern "harper-*.tgz"
      - name: Get version components
        id: version-components
        uses: matt-usurp/validate-semver@7bbc9584679de1aeef57aa531504ab00438481ab # v2.1.0
        with:
          version: ${{ github.event.release.tag_name || inputs.tag_name }}
      - name: Set package tag
        id: package-tag
        env:
          PACKAGE_NAME: harper
          VERSION: ${{ steps.version-components.outputs.version }}
          PRERELEASE: ${{ steps.version-components.outputs.prerelease }}
          RELEASE_LINE: ${{ steps.version-components.outputs.major }}.${{ steps.version-components.outputs.minor }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == '' ]]; then
            baseTag=latest
          else
            baseTag=next
          fi
          # Only move the base tag forward: a maintenance release (e.g. 5.0.x
          # published after 5.1.x) must not steal `latest` from a newer line —
          # it gets a line-scoped tag (e.g. `latest-5.0`) instead. See #1644.
          # E404 means the tag doesn't exist yet (first publish); any other npm
          # error must abort — treating it as "no tag" would steal the tag.
          viewStatus=0
          currentVersion=$(npm view "$PACKAGE_NAME@$baseTag" version 2>"$RUNNER_TEMP/npm-view.err") || viewStatus=$?
          if [[ $viewStatus -ne 0 ]]; then
            if grep -q 'code E404' "$RUNNER_TEMP/npm-view.err"; then
              currentVersion=''
            else
              cat "$RUNNER_TEMP/npm-view.err" >&2
              exit "$viewStatus"
            fi
          fi
          if [[ -z "$currentVersion" ]]; then
            packageTag=$baseTag
          else
            highest=$(npx --yes semver@7.8.5 "$VERSION" "$currentVersion" | tail -1)
            if [[ "$highest" == "$VERSION" ]]; then
              packageTag=$baseTag
            else
              packageTag=$baseTag-$RELEASE_LINE
            fi
          fi
          echo "Publishing $PACKAGE_NAME@$VERSION with dist-tag '$packageTag' (current $baseTag: ${currentVersion:-none})"
          echo "packageTag=$packageTag" >> "$GITHUB_OUTPUT"
      - name: Publish package to NPM registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag=${{ steps.package-tag.outputs.packageTag }} harper-*.tgz

  publish-harperfast-npm-package:
    runs-on: ubuntu-latest
    outputs:
      harper-version: ${{ steps.version-components.outputs.version }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Get release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: gh release download "$TAG_NAME" --pattern "harper-*.tgz"
      - name: Get version components
        id: version-components
        uses: matt-usurp/validate-semver@7bbc9584679de1aeef57aa531504ab00438481ab # v2.1.0
        with:
          version: ${{ github.event.release.tag_name || inputs.tag_name }}
      - name: Rename package to '@harperfast/harper'
        run: |
          mkdir package
          tar -xvf harper-${{ steps.version-components.outputs.version }}.tgz -C package --strip-components=1
          pushd package
          npm pkg set name=@harperfast/harper
          popd
          tar -czvf harperfast-harper-${{ steps.version-components.outputs.version }}.tgz package
      - name: Set package tag
        id: package-tag
        env:
          PACKAGE_NAME: '@harperfast/harper'
          VERSION: ${{ steps.version-components.outputs.version }}
          PRERELEASE: ${{ steps.version-components.outputs.prerelease }}
          RELEASE_LINE: ${{ steps.version-components.outputs.major }}.${{ steps.version-components.outputs.minor }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == '' ]]; then
            baseTag=latest
          else
            baseTag=next
          fi
          # Only move the base tag forward: a maintenance release (e.g. 5.0.x
          # published after 5.1.x) must not steal `latest` from a newer line —
          # it gets a line-scoped tag (e.g. `latest-5.0`) instead. See #1644.
          # E404 means the tag doesn't exist yet (first publish); any other npm
          # error must abort — treating it as "no tag" would steal the tag.
          viewStatus=0
          currentVersion=$(npm view "$PACKAGE_NAME@$baseTag" version 2>"$RUNNER_TEMP/npm-view.err") || viewStatus=$?
          if [[ $viewStatus -ne 0 ]]; then
            if grep -q 'code E404' "$RUNNER_TEMP/npm-view.err"; then
              currentVersion=''
            else
              cat "$RUNNER_TEMP/npm-view.err" >&2
              exit "$viewStatus"
            fi
          fi
          if [[ -z "$currentVersion" ]]; then
            packageTag=$baseTag
          else
            highest=$(npx --yes semver@7.8.5 "$VERSION" "$currentVersion" | tail -1)
            if [[ "$highest" == "$VERSION" ]]; then
              packageTag=$baseTag
            else
              packageTag=$baseTag-$RELEASE_LINE
            fi
          fi
          echo "Publishing $PACKAGE_NAME@$VERSION with dist-tag '$packageTag' (current $baseTag: ${currentVersion:-none})"
          echo "packageTag=$packageTag" >> "$GITHUB_OUTPUT"
      - name: Publish package to NPM registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag=${{ steps.package-tag.outputs.packageTag }} harperfast-harper-*.tgz

  send-slack-message-on-success:
    if: success() && !cancelled()
    needs:
      - publish-harperfast-npm-package
      - publish-harper-npm-package
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack published notification
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#development-ci",
              "text": "Harper v${{ needs.publish-harper-npm-package.outputs.harper-version }} has been published to NPM",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Harper v${{ needs.publish-harper-npm-package.outputs.harper-version }} release"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":white_check_mark: Published to :npm:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<https://www.npmjs.com/package/harper/v/${{ needs.publish-harper-npm-package.outputs.harper-version }}|harper@${{ needs.publish-harper-npm-package.outputs.harper-version }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<https://www.npmjs.com/package/@harperfast/harperfast/v/${{ needs.publish-harperfast-npm-package.outputs.harper-version }}|@harperfast/harper@${{ needs.publish-harperfast-npm-package.outputs.harper-version }}>"
                    }
                  ]
                }
              ]
            }

  send-slack-message-on-failure:
    if: failure() && !cancelled()
    needs:
      - publish-harperfast-npm-package
      - publish-harper-npm-package
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#development-ci",
              "text": "Harper v${{ needs.publish-harper-npm-package.outputs.harper-version }} NPM publish failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Harper v${{ needs.publish-harper-npm-package.outputs.harper-version }} release"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":x: Failed to publish to :npm:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run ${{ github.run_id }}>"
                    }
                  ]
                }
              ]
            }
