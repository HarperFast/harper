name: Integration Tests

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

jobs:
  generate-node-version-matrix:
    name: Generate Node Version Matrix
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.set-node-versions.outputs.node-versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set Node versions
        id: set-node-versions
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR pushes run a single representative Node version to keep the dev loop fast;
            # the full 22/24/26 matrix runs on push to main/release and on the nightly schedule.
            echo "node-versions=[24]" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.node-version }}" == "all" ] || [ -z "${{ github.event.inputs.node-version }}" ]; then
            # TEMPORARY: pinned to 26.5.0 instead of floating "26" — 26.5.1's llhttp/undici bump
            # (deps: llhttp 9.4.2->9.4.3, undici 8.7.0->8.9.0) exposed a genuine Harper-side defect
            # (TTL-reset-on-write silently loses to the eviction sweep on the operations-API/SQL/
            # custom-resource write surfaces; confirmed NOT an undici-client artifact via a curl-based
            # discriminator, and NOT a request-latency race via direct commit timing) plus a
            # pre-existing per-thread config-reload race (#1747) made more visible by the same bump.
            # Remove this pin once the underlying race is fixed — see harper#2025, which stays open
            # until then. Do not extend this pin to unit-test.yml or other workflows without new evidence.
            echo "node-versions=[22, 24, \"26.5.0\"]" >> $GITHUB_OUTPUT
          else
            # Manual dispatch intentionally does NOT apply the 26.5.0 pin above: selecting "26"
            # here floats to the latest 26.x release, so it doubles as the live reproducer for
            # checking whether harper#2025 is still reproducing on the newest Node 26 patch.
            echo "node-versions=[${{ github.event.inputs.node-version }}]" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Harper (Node.js v${{ matrix.node-version }})
    needs: generate-node-version-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-build-artifacts-node-${{ matrix.node-version }}
          path: |
            dist/
            static/
            node_modules/
            package.json
          retention-days: 7

  run-integration-tests:
    name: Integration Tests ${{matrix.shard}}/6 (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [generate-node-version-matrix, build]
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harper-build-artifacts-node-${{ matrix.node-version }}

      - name: Relink bin scripts
        run: npm install --ignore-scripts

      - name: Install harperdb@4 for legacy tests
        run: |
          mkdir -p /tmp/harperdb-legacy
          npm install --ignore-scripts --prefix /tmp/harperdb-legacy harperdb@4

      - name: Install harper@5.1.22 for cross-version upgrade tests
        run: |
          mkdir -p /tmp/harper-legacy-51
          npm install --ignore-scripts --prefix /tmp/harper-legacy-51 harper@5.1.22

      - name: Run Integration Test Shard ${{ matrix.shard }}
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_LEGACY_VERSION_PATH: /tmp/harperdb-legacy/node_modules/harperdb
          HARPER_LEGACY_51_PATH: /tmp/harper-legacy-51/node_modules/harper/dist/bin/harper.js
          HARPER_INTEGRATION_TEST_INSTALL_SCRIPT: dist/bin/harper.js
        run: |
          npm run test:integration:all -- --shard=${{ matrix.shard }}/6

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore

  build-windows:
    name: Build Harper (Windows, Node.js v24)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build
        continue-on-error: true # we currently have type errors so just ignore that

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-build-artifacts-windows
          path: |
            dist/
            static/
            node_modules/
            package.json
          retention-days: 1

  run-integration-tests-windows:
    name: Integration Tests ${{matrix.shard}}/6 (Windows, Node.js v24)
    runs-on: windows-latest
    needs: [build-windows]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harper-build-artifacts-windows

      - name: Relink bin scripts
        run: npm install --ignore-scripts

      - name: Install harperdb@4 for legacy tests
        run: npm install --ignore-scripts --prefix "${{ runner.temp }}/harperdb-legacy" harperdb@4

      - name: Run Integration Test Shard ${{ matrix.shard }}
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: ${{ runner.temp }}/harper-integration-test-logs
          HARPER_LEGACY_VERSION_PATH: ${{ runner.temp }}/harperdb-legacy/node_modules/harperdb
          HARPER_INTEGRATION_TEST_INSTALL_SCRIPT: dist/bin/harper.js
        run: npm run test:integration:all -- --shard=${{ matrix.shard }}/6

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-windows-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore

  run-integration-tests-bun:
    name: Integration Tests ${{matrix.shard}}/6 (Bun)
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harper-build-artifacts-node-24

      - name: Relink bin scripts
        run: npm install --ignore-scripts

      - name: Run Integration Test Shard ${{ matrix.shard }}
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_RUNTIME: bun
          HARPER_INTEGRATION_TEST_INSTALL_SCRIPT: dist/bin/harper.js
        run: |
          npm run test:integration:all -- --shard=${{ matrix.shard }}/6

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-bun-shard-${{ matrix.shard }}
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore

  run-integration-tests-uws:
    name: Integration Tests ${{matrix.shard}}/6 (uWS HTTP)
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harper-build-artifacts-node-24

      - name: Relink bin scripts
        run: npm install --ignore-scripts

      - name: Install harperdb@4 for legacy tests
        run: |
          mkdir -p /tmp/harperdb-legacy
          npm install --ignore-scripts --prefix /tmp/harperdb-legacy harperdb@4

      - name: Install harper@5.1.22 for cross-version upgrade tests
        run: |
          mkdir -p /tmp/harper-legacy-51
          npm install --ignore-scripts --prefix /tmp/harper-legacy-51 harper@5.1.22

      # Serve the plaintext app HTTP port(s) through uWebSockets.js instead of the Node http server
      # (#914). Only non-secure, non-operations TCP ports are affected; secure/replication/ops paths
      # keep running on Node, so this exercises the uWS request/streaming/WS/GraphQL/Fastify-fallback
      # path against the full integration suite.
      - name: Run Integration Test Shard ${{ matrix.shard }}
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_LEGACY_VERSION_PATH: /tmp/harperdb-legacy/node_modules/harperdb
          HARPER_LEGACY_51_PATH: /tmp/harper-legacy-51/node_modules/harper/dist/bin/harper.js
          HARPER_UWS_HTTP: 1
          HARPER_INTEGRATION_TEST_INSTALL_SCRIPT: dist/bin/harper.js
        run: |
          npm run test:integration:all -- --shard=${{ matrix.shard }}/6

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-uws-shard-${{ matrix.shard }}
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore

  # Non-blocking nightly canary for the pin above (harper#2025): the default matrix no longer
  # exercises Node >=26.5.1 at all, so this keeps a signal alive on whatever the latest 26.x
  # release is, without reddening the required checks. `continue-on-error: true` means a failure
  # here shows as a warning in the run summary, not a red X — check it manually or via the
  # "Integration Tests" workflow history when triaging harper#2025. Targets only the two test
  # files the pin exists for; the full 6-shard matrix would cost more than this canary is worth.
  canary-node26-latest:
    name: Canary — Node 26 latest (harper#2025, non-blocking)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 26 (floating latest)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Run harper#2025 canary tests
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_INTEGRATION_TEST_INSTALL_SCRIPT: dist/bin/harper.js
        run: |
          npm run test:integration -- "integrationTests/database/ttlResetOnWrite.test.ts" "integrationTests/components/static-cache-headers.test.ts"

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-canary-node26-latest
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore
