# PR-description checks.
#
# Runs on pull_request_target and checks out the BASE BRANCH, never the PR head: the coverage
# check gates the PR, so a PR must not be able to edit it. `base.ref` rather than `base.sha` —
# the workflow file already comes from the base branch tip, and pinning the action to the sha the
# PR forked from runs a stale copy on any long-lived branch. No PR code is executed here — the
# coverage evaluation reads the event payload, and the membership resolution and file-hunk
# collection read the API — so the usual pull_request_target hazard does not apply. Permissions
# stay read-only regardless; the app token minted below is scoped to members:read + metadata:read.
name: review-coverage
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: review-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: .github/actions/review-coverage
      - name: Mint a members:read-scoped app token
        id: app-token
        # The webhook's author_association is wrong for a PRIVATE org membership: only a
        # credential carrying members:read can see it, and GITHUB_TOKEN cannot be granted that
        # permission at all. harperfastaibot already holds members:read org-wide and already has
        # its secrets wired into this repo for the Claude/Gemini review bots.
        if: >-
          github.event.pull_request.user.type != 'Bot' &&
          !endsWith(github.event.pull_request.user.login, '[bot]')
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
          private-key: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}
          permission-members: read
          permission-metadata: read
      - name: Resolve live org membership
        id: author
        # resolveMembership.sh only ever prints MEMBER or nothing — never a demotion — so a
        # failed mint, a failed lookup, or a confirmed non-member all leave this output empty,
        # falling back to the webhook's own association below and in the composite action.
        if: steps.app-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          association=$(.github/actions/review-coverage/resolveMembership.sh "$ORG" "$LOGIN")
          [[ -n "$association" ]] && echo "author_association=$association" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Collect current PR file hunks
        id: pr-files
        if: >-
          github.event.pull_request.user.type != 'Bot' &&
          !endsWith(github.event.pull_request.user.login, '[bot]') &&
          (steps.author.outputs.author_association == 'MEMBER' ||
           github.event.pull_request.author_association == 'MEMBER' ||
           github.event.pull_request.author_association == 'OWNER')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$GH_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          api_with_retry() {
            local output=$1
            shift
            for attempt in 1 2 3; do
              if gh api "$@" > "$output"; then
                return 0
              fi
              (( attempt == 3 )) && return 1
              sleep "$attempt"
            done
          }
          head_response="$RUNNER_TEMP/pr-head.txt"
          api_with_retry "$head_response" "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha'
          live_head=$(<"$head_response")
          if [[ "$live_head" != "$EVENT_HEAD" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          output="$RUNNER_TEMP/pr-files.json"
          files_response="$RUNNER_TEMP/pr-files-response.json"
          api_with_retry "$files_response" --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100"
          node .github/actions/review-coverage/collectPrFiles.mjs "$output" < "$files_response"
          api_with_retry "$head_response" "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha'
          live_head=$(<"$head_response")
          if [[ "$live_head" != "$EVENT_HEAD" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/review-coverage
        with:
          mode: enforce
          format_mode: report
          framing_mode: enforce
          framing_paths: |
            resources/Table.ts
            resources/RecordEncoder.ts
            resources/tracked.ts
            resources/PrimaryRocksDatabase.ts
            replication/**
            bin/copyDb.ts
            dataLayer/harperBridge/ResourceBridge.ts
            dataLayer/harperBridge/lmdbBridge/lmdbMethods/lmdbGetBackup.js
            dataLayer/restoreMarker.ts
            dataLayer/rocksdbBackup.ts
            dataLayer/schemaDescribe.ts
            resources/DatabaseTransaction.ts
            resources/LMDBTransaction.ts
            resources/RocksIndexStore.ts
            resources/RocksTransactionLogStore.ts
            resources/analytics/write.ts
            resources/auditStore.ts
            resources/blob.ts
            resources/branchDatabase.ts
            resources/databases.ts
            resources/derivedIndexes.ts
            resources/derivedIndexRuntime.ts
            resources/indexes/HierarchicalNavigableSmallWorld.ts
            resources/longLivedTransactions.ts
            resources/nodeIdMapping.ts
            resources/replayLogs.ts
            resources/search.ts
            server/http.ts
            server/transactionLogCooling.ts
            utility/environment/systemInformation.ts
            utility/lmdb/commonUtility.ts
            utility/lmdb/deleteUtility.ts
            utility/lmdb/environmentUtility.ts
            utility/lmdb/searchUtility.ts
            utility/lmdb/writeUtility.ts
          pr_files: ${{ steps.pr-files.outputs.path }}
          pr_files_ready: ${{ steps.pr-files.outputs.ready }}
          pr_files_superseded: ${{ steps.pr-files.outputs.superseded }}
          pr_author_association: ${{ steps.author.outputs.author_association }}
