# PR-description checks.
#
# Runs on pull_request_target and checks out the BASE BRANCH, never the PR head: the coverage
# check gates the PR, so a PR must not be able to edit it. `base.ref` rather than `base.sha` —
# the workflow file already comes from the base branch tip, and pinning the action to the sha the
# PR forked from runs a stale copy on any long-lived branch. No PR code is executed here — the
# coverage evaluation reads the event payload, and the author-association resolution and
# file-hunk collection read the API — so the usual pull_request_target hazard does not apply.
# Permissions stay read-only regardless.
name: review-coverage
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: review-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: .github/actions/review-coverage
      - name: Resolve current author association
        id: author
        # The webhook payload's author_association can be stale — GitHub documents that it may
        # not reflect the account's current relationship to the repo. A membership grant that
        # hasn't propagated into a cached payload otherwise exempts a member's PR from coverage
        # enforcement permanently, since synchronize doesn't recompute it. Failing open here (no
        # `set -e` on the retry loop, no output on exhaustion) falls back to the payload's own
        # value below and in the composite action, matching the pre-existing behavior.
        if: >-
          github.event.pull_request.user.type != 'Bot' &&
          !endsWith(github.event.pull_request.user.login, '[bot]')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          [[ "$GH_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 0
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 0
          for attempt in 1 2 3; do
            association=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.author_association') && break
            (( attempt == 3 )) && exit 0
            sleep "$attempt"
          done
          [[ -n "$association" ]] && echo "association=$association" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Collect current PR file hunks
        id: pr-files
        if: >-
          github.event.pull_request.user.type != 'Bot' &&
          !endsWith(github.event.pull_request.user.login, '[bot]') &&
          ((steps.author.outputs.association || github.event.pull_request.author_association) == 'MEMBER' ||
           (steps.author.outputs.association || github.event.pull_request.author_association) == 'OWNER')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$GH_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          api_with_retry() {
            local output=$1
            shift
            for attempt in 1 2 3; do
              if gh api "$@" > "$output"; then
                return 0
              fi
              (( attempt == 3 )) && return 1
              sleep "$attempt"
            done
          }
          head_response="$RUNNER_TEMP/pr-head.txt"
          api_with_retry "$head_response" "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha'
          live_head=$(<"$head_response")
          if [[ "$live_head" != "$EVENT_HEAD" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          output="$RUNNER_TEMP/pr-files.json"
          files_response="$RUNNER_TEMP/pr-files-response.json"
          api_with_retry "$files_response" --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100"
          node .github/actions/review-coverage/collectPrFiles.mjs "$output" < "$files_response"
          api_with_retry "$head_response" "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha'
          live_head=$(<"$head_response")
          if [[ "$live_head" != "$EVENT_HEAD" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/review-coverage
        with:
          mode: enforce
          format_mode: report
          framing_mode: enforce
          framing_paths: |
            resources/Table.ts
            resources/RecordEncoder.ts
            resources/tracked.ts
            resources/PrimaryRocksDatabase.ts
            replication/**
            bin/copyDb.ts
            dataLayer/harperBridge/ResourceBridge.ts
            dataLayer/harperBridge/lmdbBridge/lmdbMethods/lmdbGetBackup.js
            dataLayer/restoreMarker.ts
            dataLayer/rocksdbBackup.ts
            dataLayer/schemaDescribe.ts
            resources/DatabaseTransaction.ts
            resources/LMDBTransaction.ts
            resources/RocksIndexStore.ts
            resources/RocksTransactionLogStore.ts
            resources/analytics/write.ts
            resources/auditStore.ts
            resources/blob.ts
            resources/branchDatabase.ts
            resources/databases.ts
            resources/derivedIndexRuntime.ts
            resources/indexes/HierarchicalNavigableSmallWorld.ts
            resources/longLivedTransactions.ts
            resources/nodeIdMapping.ts
            resources/replayLogs.ts
            resources/search.ts
            server/http.ts
            server/transactionLogCooling.ts
            utility/environment/systemInformation.ts
            utility/lmdb/commonUtility.ts
            utility/lmdb/deleteUtility.ts
            utility/lmdb/environmentUtility.ts
            utility/lmdb/searchUtility.ts
            utility/lmdb/writeUtility.ts
          pr_files: ${{ steps.pr-files.outputs.path }}
          pr_files_ready: ${{ steps.pr-files.outputs.ready }}
          pr_files_superseded: ${{ steps.pr-files.outputs.superseded }}
          pr_author_association: ${{ steps.author.outputs.association }}
