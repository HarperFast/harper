name: Lint Source Code
on:
  push:
    branches:
      - main
      - 'release_*'
  pull_request:
  schedule:
    - cron: '11 13 * * 1-5' # Run M-F at 13:11
  workflow_dispatch:

jobs:
  runLinter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit; its first parent is the base the
          # design-doc ceilings are compared against.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          # .node-version holds only the major; without this, setup-node uses whatever release of that major the runner has cached.
          check-latest: true
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:required
      - name: Check design docs
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        # A push compares against the tip it replaced, so every commit of a multi-commit push is covered.
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            base=$BEFORE
          fi
          npm run check:design-docs -- ${base:+--base "$base"}
      - run: npm run check:unit-partition
