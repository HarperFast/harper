name: Docs Preview

# HarperFast/documentation's source-pr-preview.yaml builds, deploys and comments the preview.
#
# pull_request_target, so a fork's PR can dispatch as well: never check out or run anything from the
# PR here, and never put PR text (title, branch, body) into a run: step.

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions: {}

jobs:
  dispatch:
    name: Request the docs preview
    if: >-
      (github.event.action == 'labeled' && github.event.pull_request.state == 'open' && github.event.label.name == 'docs-preview') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview') ||
      (contains(fromJSON('["synchronize", "reopened"]'), github.event.action) && github.event.pull_request.state == 'open' &&
        contains(github.event.pull_request.labels.*.name, 'docs-preview')) ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'docs-preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GITHUB_TOKEN cannot dispatch to another repository.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
          private-key: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}
          owner: HarperFast
          repositories: documentation
          permission-contents: write
      - name: Dispatch to HarperFast/documentation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT: ${{ contains(fromJSON('["unlabeled", "closed"]'), github.event.action) && 'docs-source-pr-preview-cleanup' || 'docs-source-pr-preview' }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -n --arg event "$EVENT" --arg repo "$GITHUB_REPOSITORY" --argjson number "$NUMBER" \
            '{event_type: $event, client_payload: {repo: $repo, number: $number}}' |
            gh api repos/HarperFast/documentation/dispatches --input -
