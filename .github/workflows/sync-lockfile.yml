name: Sync Lock File

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  schedule:
    - cron: '0 9 * * 1' # Run every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  sync-lockfile:
    name: Sync Lock File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Regenerate lock file
        run: npm install --package-lock-only --ignore-scripts

      - name: Check for lock file drift
        id: drift
        run: |
          git add package-lock.json
          if git diff --cached --quiet package-lock.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub token
        if: steps.drift.outputs.has_changes == 'true'
        id: github-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Create PR if lock file drifted
        if: steps.drift.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.github-token.outputs.token }}
          add-paths: package-lock.json
          commit-message: 'chore: sync package-lock.json with package.json'
          committer: 'HarperFast <noreply@harperdb.io>'
          branch: chore/sync-lockfile
          delete-branch: true
          title: 'chore: sync package-lock.json with package.json'
          body: |
            `package-lock.json` has drifted from `package.json`. This PR regenerates the lock file.

            Generated by the [Sync Lock File](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
          labels: dependencies
