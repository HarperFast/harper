name: Node 26 Canary (harper#2025)

# Non-blocking canary for the temporary Node-26 CI pin in integration-tests.yml: that pin holds
# the default matrix's Node-26 entry at 26.5.0 because 26.5.1's llhttp/undici bump surfaced a
# fetch/undici regression (see harper#2025), so the default matrix no longer exercises Node
# >=26.5.1 at all. This workflow keeps a signal alive on whatever the latest 26.x release is,
# in its own file with its own schedule — deliberately NOT a job inside
# integration-tests.yml, because that workflow's nightly conclusion is what the repo's
# nightly-gate triage routine reads before drilling into individual jobs, and this canary's
# steady state is not the same "green means fine" shape as an ordinary test job.
#
# The floating Node 26 job's conclusion is intentionally INVERTED: the harper#2025 fetch-latency
# reproducer failing is SUCCESS (the known defect is still there), while an unexpected pass fails
# loudly for investigation. The scheduled 26.5.0 control uses ordinary polarity and must pass;
# together the two jobs distinguish a current-Node regression from a broken discriminator. See the
# "Run harper#2025 canary tests" step below for the classification itself.
#
# Remove this workflow when the pin in integration-tests.yml comes out — see harper#2025, which
# stays open until then.
#
# Coverage note: harper#2029 moved the supported static-cache-header and TTL suites from fetch to
# node:http so they no longer exercise bundled undici. This canary explicitly runs the preserved
# pre-#2029 static-cache fetch pattern instead. It does NOT cover replication, the NATS/MQTT
# brokers, the operations API, or the uWS HTTP path, so independent regressions on those surfaces
# remain invisible until the pin comes out.
on:
  schedule:
    - cron: '0 7 * * *'
  pull_request:
    paths:
      - '.github/canaries/static-cache-headers-fetch.test.ts'
      - '.github/workflows/node26-canary.yml'
      - 'integrationTests/fixtures/static-cache-headers/**'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version (26 floats to latest; 26.5.0 is the known-good control)'
        required: true
        type: choice
        default: '26'
        options:
          - '26'
          - '26.5.0'

permissions:
  contents: read

jobs:
  canary-node26-latest:
    name: Canary — Node ${{ matrix.node-version }} (harper#2025, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name != 'workflow_dispatch' && fromJSON('["26", "26.5.0"]') || fromJSON(format('["{0}"]', inputs.node-version)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          # Without this, setup-node prefers whatever 26.x is already in the runner's tool
          # cache over querying for the actual latest release — silently defeating the whole
          # point of this job once Node 26 lands in the ubuntu-latest image's default toolcache.
          check-latest: ${{ matrix.node-version == '26' }}

      - name: Assert the requested Node version resolved
        env:
          REQUESTED_NODE_VERSION: ${{ matrix.node-version }}
        # check-latest REQUESTS the newest 26.x; it does not guarantee one lands (a degraded
        # manifest lookup falls back to the toolcache). Silently running the pinned version
        # again and reporting green would be the canary's worst failure mode: it would look
        # like "latest Node 26 is clean" while >=26.5.1 was never actually executed. Red and
        # inconclusive beats green and wrong.
        run: |
          resolved="$(node --version)"
          echo "Resolved Node version: $resolved (bundled undici $(node -p 'process.versions.undici'))" | tee -a "$GITHUB_STEP_SUMMARY"
          node -e '
            const [maj, min, patch] = process.versions.node.split(".").map(Number);
            // Keep in sync with the "26.5.0" pin in integration-tests.yml — if the matrix pin is
            // ever bumped without updating this, the assert below stops meaning "newer than
            // what the matrix already covers".
            const pinned = [26, 5, 0];
            const newer = maj > pinned[0]
              || (maj === pinned[0] && min > pinned[1])
              || (maj === pinned[0] && min === pinned[1] && patch > pinned[2]);
            if (process.env.REQUESTED_NODE_VERSION === "26.5.0" && process.versions.node !== "26.5.0") {
              console.error(`::error::requested the pinned control Node 26.5.0 but resolved ${process.versions.node}`);
              process.exit(1);
            }
            if (process.env.REQUESTED_NODE_VERSION === "26" && !newer) {
              console.error(`::error::resolved Node ${process.versions.node} is not newer than the 26.5.0 pin — check-latest likely fell back to a cached/lagged version. This run cannot demonstrate anything about harper#2025 on >=26.5.1 and must not be read as a pass.`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Guard against a moved/renamed canary target, or a missing build output
        run: |
          for f in "dist/bin/harper.js" ".github/canaries/static-cache-headers-fetch.test.ts" "integrationTests/fixtures/static-cache-headers/config.yaml" "integrationTests/apiTests/utils/client.mjs"; do
            if [ ! -f "$f" ]; then
              echo "::error::canary target missing: $f — a moved/renamed test would silently match nothing and exit 0; a missing dist/bin/harper.js means the 'npm run build || true' above swallowed a real build failure."
              exit 1
            fi
          done

      # No continue-on-error anywhere in this job: it lives in its own workflow specifically so
      # it CAN fail honestly (see the header comment) without corrupting integration-tests.yml's
      # conclusion. Let it fail naturally.
      # Inverted on purpose: this job's conclusion needs to mean "a human should look at this",
      # not "the known defect reproduced" — nightly-gate's scheduled-run sweep
      # (~/.claude/skills/nightly-gate/SKILL.md) enumerates every `--event schedule` workflow and
      # expects `success`, with no per-workflow allowlist. If this step's own exit code were the
      # job's conclusion, the EXPECTED nightly outcome (harper#2025 still reproducing) would be a
      # permanent red that nightly-gate dutifully triages and re-triages forever, while the one
      # outcome anyone actually wants to hear about — the defect clearing upstream — would be
      # silently green and fire no alert. So: the tests failing (matching harper#2025) is this
      # job's SUCCESS; the tests unexpectedly passing is what fails it loudly.
      - name: Run harper#2025 canary tests
        id: canary-tests
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_INTEGRATION_TEST_INSTALL_SCRIPT: dist/bin/harper.js
          REQUESTED_NODE_VERSION: ${{ matrix.node-version }}
        run: |
          set +e
          test_output_file="$RUNNER_TEMP/harper-2025-canary-output.log"
          npm run test:integration -- ".github/canaries/static-cache-headers-fetch.test.ts" 2>&1 | tee "$test_output_file"
          test_exit=${PIPESTATUS[0]}
          set -e
          if ! grep -Fq "Node 26 fetch canary: static plugin cache-header options" "$test_output_file"; then
            echo "::error::the canary suite did not execute — refusing to interpret exit $test_exit as evidence about harper#2025."
            exit 1
          fi
          reproduced=false
          if grep -Fq "harper#2025 fetch discriminator:" "$test_output_file"; then
            reproduced=true
          fi
          if [ "$test_exit" -ne 0 ]; then
            echo "::error::the Node $(node --version) canary failed outside harper#2025's handled discriminator path (exit $test_exit)."
            exit 1
          elif [ "$REQUESTED_NODE_VERSION" = "26.5.0" ]; then
            if [ "$reproduced" = true ]; then
              echo "::error::harper#2025 reproduced on the pinned Node $(node --version) control — the discriminator is invalid."
              exit 1
            else
              echo "harper#2025 fetch canary control passed as expected on pinned Node $(node --version)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          elif [ "$reproduced" = false ]; then
            echo "::error::harper#2025 no longer reproduces on Node $(node --version) — the fetch canary PASSED, which is unexpected while the issue is open. Corroborate in harper-pro before removing the temporary pin in integration-tests.yml or proposing closure of harper#2025."
            echo "**harper#2025 fetch canary: UNEXPECTED PASS on Node $(node --version)** — corroboration required. See harper#2025." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "harper#2025 fetch canary: reproduced as expected on Node $(node --version) — issue is still open, no action needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      # Always, not `if: failure()`: the canary-tests step exits 0 on its expected-reproduction
      # path (see above), so `failure()` alone would miss the run anyone chasing harper#2025
      # actually wants logs from. Cheap either way at retention-days: 3.
      - name: Upload Harper server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-canary-node-${{ matrix.node-version }}
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore
