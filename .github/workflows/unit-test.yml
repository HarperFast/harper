name: Unit Test

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

# These workflows are dispatched by cherry-pick-patch.yml against a branch built
# from PR commits, so they run PR-authored build/test scripts. The repo default is
# a write-scoped token; pin it to read here.
permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # A job that hits this cap is reported as `cancelled`, not `failure`, so it reads as non-red
    # on a required check. Every step below is capped in its own right and this sits above their
    # sum (49 on the longest leg), so a stall surfaces as a step failure and this stays a backstop.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ (github.event.inputs.node-version == 'all' || github.event.inputs.node-version == '') && fromJSON('[22, 24, 26]') || fromJSON(format('[{0}]', github.event.inputs.node-version)) }}

    steps:
      - name: Checkout code
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        timeout-minutes: 6
        run: npm install --ignore-scripts

      - name: Build
        timeout-minutes: 3
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Type contract tests
        if: matrix.node-version == 22
        timeout-minutes: 3
        run: npm run test:types # strict tsc over unitTests/types/ — asserts the shipped public types

      - name: Benchmark unit tests
        timeout-minutes: 3
        run: npm run test:bench # pure-logic tests for benchmarks/ converters; doesn't need a running Harper instance

      - name: Review-coverage action tests
        if: matrix.node-version == 24
        timeout-minutes: 3
        run: node --test .github/actions/review-coverage/*.test.mjs

      - name: Setup Harper
        id: setup-harper
        timeout-minutes: 3
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'

        run: node --enable-source-maps ./dist/bin/harper.js install

      # `.mocharc.json` sets `timeout: 0`, so nothing inside a suite can time out on its own —
      # each step's own cap is what turns a wedged suite into a reported failure, so one bad
      # top-level suite no longer hides the rest (harper#2587, harper#2017) — `test:unit:lmdb`
      # still chains its own resources/apitests/bin runs with `&&`, so a failure there stops
      # at the first of those three.
      #
      # Size each cap at roughly 1.5x the step's slowest run that REACHED mocha's epilogue, pooling
      # all three Node legs since none is reliably the slowest, and re-derive from the Actions step
      # API before changing one: a cap-killed sample is right-censored and reads far too low.
      # `resources` is the cautionary case — capped at 7m off a ~4m30-5m25 estimate that was never
      # re-measured, it reached 6m58 completed and went red on main. Last derived 2026-09-18 over
      # the 30 `Unit Test` pushes since 2026-09-14; `resources` needed ~7m40 at its worst.
      - name: 'Unit tests: main'
        if: "!cancelled() && steps.setup-harper.outcome == 'success'"
        timeout-minutes: 4
        run: npm run test:unit:main

      - name: 'Unit tests: apitests'
        if: "!cancelled() && steps.setup-harper.outcome == 'success'"
        timeout-minutes: 3
        run: npm run test:unit:apitests

      - name: 'Unit tests: resources'
        if: "!cancelled() && steps.setup-harper.outcome == 'success'"
        timeout-minutes: 12
        run: npm run test:unit:resources

      - name: 'Unit tests: lmdb'
        if: "!cancelled() && steps.setup-harper.outcome == 'success'"
        timeout-minutes: 4
        run: npm run test:unit:lmdb

  # Windows had no unit-level coverage at all before this job: every job above pins
  # ubuntu-latest, and integration-tests.yml was the only workflow touching Windows.
  # Platform-gated code and the tests written to prove it therefore never executed.
  #
  # It runs a scoped slice of the unit tree rather than the whole thing — a set of
  # suites still fail on Windows for environmental or test-design reasons that
  # reproduce on `main`, so gating on everything would land red and stay red.
  #
  # This is the same `npm run test:unit:windows` a developer runs locally, so a failure
  # here is reproducible without pushing. The scope, the exclusions (each with the
  # reason it is there) and the reason the run is split into one mocha process per
  # directory all live in unitTests/windowsGate.mjs — read its header before changing
  # what this job covers.
  #
  # Make this `unit-test-windows` job a REQUIRED status check on `main`. It fires on
  # every PR with no `paths:` filter, so it is satisfiable.
  unit-test-windows:
    name: Unit Test (Windows, Node.js v24)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build
        continue-on-error: true # we currently have type errors so just ignore that

      # Bounded below the job so a hung group fails the step rather than cancelling
      # the job, which keeps the gate's own group table in the log. The gate caps each
      # group at 10 minutes on its own, so this bounds a pathological run, not a
      # healthy one — a cold Windows runner does the whole gate in well under it.
      - name: Run unit tests
        timeout-minutes: 30
        run: npm run test:unit:windows

  # The vectorIndexPlane suite self-skips when the optional native package is absent, so the
  # load probe below is what keeps that skip from reading as a green run. The crate's own
  # tests belong to HarperFast/hnsw's CI, not here: this job runs the published prebuild, so
  # testing the crate source would grade something other than the binary under test.
  hnsw-plane:
    name: HNSW native plane (Node.js v24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      # strict here, unlike the other jobs: the plane suite runs against dist/, so a tolerated
      # build failure would grade a stale dist and still report green
      - name: Build
        run: npm run build

      - name: Verify the published native binding loads
        run: node -e "if (typeof require('@harperfast/hnsw').Plane?.open !== 'function') throw new Error('@harperfast/hnsw loaded without a Plane constructor');"

      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'
        run: node --enable-source-maps ./dist/bin/harper.js install

      - name: File-primary native plane tests
        env:
          HNSW_NATIVE_REBUILD_BENCHMARK: '1'
        run: npx mocha unitTests/resources/vectorIndexPlane.test.js
