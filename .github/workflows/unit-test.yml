name: Unit Test

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

# These workflows are dispatched by cherry-pick-patch.yml against a branch built
# from PR commits, so they run PR-authored build/test scripts. The repo default is
# a write-scoped token; pin it to read here.
permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-test:
    name: Unit Test (${{ matrix.shard }}, Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # A job that hits this cap is reported as `cancelled`, not `failure`, so it reads as non-red
    # on a required check. Every step below is capped in its own right and this sits above the
    # largest shard's sum (37 on `main`), so a stall surfaces as a step failure and this stays a backstop.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON((github.event_name == 'schedule' || github.event.inputs.node-version == 'all' || github.event_name == 'push' && github.ref_name != 'main') && '[22, 24, 26]' || github.event.inputs.node-version && format('[{0}]', github.event.inputs.node-version) || '[24, 26]') }}
        shard: [main, components, server, resources-core-a-q, resources-core-r-z, resources-indexes, lmdb]
        # harper#3349: LMDB segfaults intermittently in this shard, and every leg gates `Unit Test`.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"shard":"lmdb","node-version":24}]' || '[]') }}
        # `.mocharc.json` sets `timeout: 0`, so nothing inside a suite can time out on its own —
        # each shard's test-step cap is what turns a wedged suite into a reported failure
        # (harper#2587, harper#2017). `test:unit:lmdb` chains its own resources/apitests/bin runs
        # with `&&`, so a failure there stops at the first of those three.
        #
        # Size a cap at roughly 1.5x that suite's slowest run which REACHED mocha's epilogue,
        # pooling all Node legs since none is reliably the slowest, and re-derive it from the
        # Actions step API: a cap-killed sample is right-censored and reads far too low. The
        # `resources-core` halves are not balanced by size, so size each from its own runs.
        #
        # The resources shards partition the suite by file name, so a file added later lands in
        # exactly one of them; AGENTS.md carries the pattern. They are the only default-engine run
        # of that tree as a whole — `hnsw-plane` below and the Windows gate each run one file out
        # of it — so `check:unit-partition` in the lint job fails a glob edit that drops or doubles a file.
        include:
          - shard: main
            script: test:unit:main:core
            timeout: 8
          - shard: components
            script: test:unit:main:components
            timeout: 8
          - shard: server
            script: test:unit:main:server
            timeout: 8
          - shard: resources-core-a-q
            script: test:unit:resources:core:a-q
            timeout: 8
          - shard: resources-core-r-z
            script: test:unit:resources:core:r-z
            timeout: 6
          - shard: resources-indexes
            script: test:unit:resources:indexes
            timeout: 6
          - shard: lmdb
            script: test:unit:lmdb
            timeout: 9

    steps:
      - name: Checkout code
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          # As in integration-tests.yml: the 26 leg floats to the newest 26.x rather than a cached one, so
          # tests that only fail on the newest runtime (nodeAdapterMiddleware's pipe fast-path case) run there.
          check-latest: ${{ matrix.node-version == 26 }}

      - name: Install dependencies
        timeout-minutes: 6
        run: npm install --ignore-scripts

      - name: Build
        timeout-minutes: 3
        run: npm run build

      - name: Type contract tests
        if: matrix.shard == 'main' && matrix.node-version == 26
        timeout-minutes: 3
        run: npm run test:types # strict tsc over unitTests/types/ — asserts the shipped public types

      - name: Benchmark unit tests
        if: matrix.shard == 'main' && matrix.node-version == 26
        timeout-minutes: 3
        run: npm run test:bench # pure-logic tests for benchmarks/ converters; doesn't need a running Harper instance

      - name: Review-coverage action tests
        if: matrix.shard == 'main' && matrix.node-version == 26
        timeout-minutes: 3
        run: node --test .github/actions/review-coverage/*.test.mjs

      - name: Setup Harper
        id: setup-harper
        timeout-minutes: 3
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'

        run: node --enable-source-maps ./dist/bin/harper.js install

      - name: 'Unit tests: ${{ matrix.shard }}'
        timeout-minutes: ${{ matrix.timeout }}
        run: npm run ${{ matrix.script }}

      # Its own process: the suite runs real installs, which close and recreate the `system`
      # database the other suites share, and the user-change subscriptions on it back off for up to a
      # minute each time that happens. Runs on the lightest shard so no shard's step sum passes the job cap.
      - name: 'Unit tests: install'
        if: "!cancelled() && matrix.shard == 'resources-indexes' && steps.setup-harper.outcome == 'success'"
        timeout-minutes: 3
        run: npm run test:unit:install

      - name: 'Unit tests: apitests'
        if: "!cancelled() && matrix.shard == 'components' && steps.setup-harper.outcome == 'success'"
        timeout-minutes: 3
        run: npm run test:unit:apitests

  unit-test-source:
    name: Native Unit Test (${{ matrix.shard }}, Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 and 24.0.0 are the package.json `engines` floors, the oldest runtimes that must
        # run the .ts sources directly; they run with Node 22 nightly. Caps follow the rule on the
        # `unit-test` job.
        node-version: ${{ fromJSON((github.event_name == 'schedule' || github.event.inputs.node-version == 'all' || github.event_name == 'push' && github.ref_name != 'main') && '["22.18.0", "24.0.0", 22, 24, 26]' || github.event.inputs.node-version && format('[{0}]', github.event.inputs.node-version) || '[24, 26]') }}
        shard: [core, resources-core-a-q, resources-core-r-z, resources-indexes]
        include:
          - shard: core
            script: test:unit:typestrip
            timeout: 10
          - shard: resources-core-a-q
            script: test:unit:typestrip:resources:core:a-q
            timeout: 8
          - shard: resources-core-r-z
            script: test:unit:typestrip:resources:core:r-z
            timeout: 6
          - shard: resources-indexes
            script: test:unit:typestrip:resources:indexes
            timeout: 6
    steps:
      - name: Checkout code
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          check-latest: ${{ matrix.node-version == 26 }}
      - name: Install dependencies
        timeout-minutes: 6
        run: npm ci --ignore-scripts
      - name: Verify no compiled distribution
        timeout-minutes: 1
        run: test ! -d dist
      - name: Check unit harness types
        if: matrix.shard == 'core'
        timeout-minutes: 2
        run: npm run test:types:unit
      - name: 'Native units: ${{ matrix.shard }}'
        timeout-minutes: ${{ matrix.timeout }}
        run: npm run ${{ matrix.script }}

  # Windows had no unit-level coverage at all before this job: every job above pins
  # ubuntu-latest, and integration-tests.yml was the only workflow touching Windows.
  # Platform-gated code and the tests written to prove it therefore never executed.
  #
  # It runs a scoped slice of the unit tree rather than the whole thing — a set of
  # suites still fail on Windows for environmental or test-design reasons that
  # reproduce on `main`, so gating on everything would land red and stay red.
  #
  # This is the same `npm run test:unit:windows` a developer runs locally, so a failure
  # here is reproducible without pushing. The scope, the exclusions (each with the
  # reason it is there) and the reason the run is split into one mocha process per
  # directory all live in unitTests/windowsGate.mjs — read its header before changing
  # what this job covers.
  unit-test-windows:
    name: Unit Test (Windows, Node.js v26)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      # Bounded below the job so a hung group fails the step rather than cancelling
      # the job, which keeps the gate's own group table in the log. The gate caps each
      # group at 10 minutes on its own, so this bounds a pathological run, not a
      # healthy one — a cold Windows runner does the whole gate in well under it.
      - name: Run unit tests
        timeout-minutes: 30
        run: npm run test:unit:windows

  # The vectorIndexPlane suite self-skips when the optional native package is absent, so the
  # load probe below is what keeps that skip from reading as a green run. The crate's own
  # tests belong to HarperFast/hnsw's CI, not here: this job runs the published prebuild, so
  # testing the crate source would grade something other than the binary under test.
  hnsw-plane:
    name: HNSW native plane (Node.js v26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify the published native binding loads
        run: node -e "if (typeof require('@harperfast/hnsw').Plane?.open !== 'function') throw new Error('@harperfast/hnsw loaded without a Plane constructor');"

      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'
        run: node --enable-source-maps ./dist/bin/harper.js install

      - name: File-primary native plane tests
        env:
          HNSW_NATIVE_REBUILD_BENCHMARK: '1'
        run: npx mocha unitTests/resources/vectorIndexPlane.test.js

  uws-tcp-macos:
    name: uWS TCP uploads (macOS, Node.js v26)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify the uWS native binding loads
        run: node -e "require('uWebSockets.js')"

      - name: Oversized TCP upload regressions
        run: npx mocha unitTests/server/serverHelpers/uwsServer.test.js --grep 'uWS oversized TCP uploads' --forbid-pending --fail-zero

  fulltext-plane:
    name: Full-text native plane (${{ matrix.os }}, Node.js v26)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify the published native binding loads
        run: node --input-type=module --eval "const binding = await import('@harperfast/fulltext/native'); if (typeof binding.openNativeFullTextIndex !== 'function' || typeof binding.openNativeFullTextReader !== 'function' || typeof binding.NativeFullTextIndex?.prototype.searchPage !== 'function' || (await binding.runtimeInfo()).queryApiVersion !== 4) throw new Error('@harperfast/fulltext loaded without the required writer, reader, and query API 4 contract');"

      - name: Native full-text lifecycle test
        run: >-
          npx mocha
          unitTests/resources/nativeFullTextDerivedIndexLifecycle.test.js
          unitTests/resources/nativeFullTextTableSearch.test.js
          unitTests/resources/nativeFullTextSchemaUpgrade.test.js
          unitTests/resources/nativeFullTextUpgradeWorkers.test.js
          unitTests/resources/nativeFullTextUpgradeCrash.test.js
          --forbid-pending --fail-zero

  # The one required check for this workflow: branch protection names this job rather than the
  # legs, so legs can be added or renamed without touching the ruleset. `always()` rather than
  # `!cancelled()`, because a skipped required check reads as passing. Every job above runs
  # unconditionally, so `success` is the only passing result.
  unit-test-result:
    name: Unit Test
    if: always()
    needs: [unit-test, unit-test-source, unit-test-windows, hnsw-plane, uws-tcp-macos, fulltext-plane]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every unit-test job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
