name: Unit Test

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

# These workflows are dispatched by cherry-pick-patch.yml against a branch built
# from PR commits, so they run PR-authored build/test scripts. The repo default is
# a write-scoped token; pin it to read here.
permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ (github.event.inputs.node-version == 'all' || github.event.inputs.node-version == '') && fromJSON('[22, 24, 26]') || fromJSON(format('[{0}]', github.event.inputs.node-version)) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Type contract tests
        if: matrix.node-version == 22
        run: npm run test:types # strict tsc over unitTests/types/ — asserts the shipped public types

      - name: Benchmark unit tests
        run: npm run test:bench # pure-logic tests for benchmarks/ converters; doesn't need a running Harper instance

      - name: Review-coverage action tests
        if: matrix.node-version == 24
        run: node --test .github/actions/review-coverage/*.test.mjs

      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'

        run: node --enable-source-maps ./dist/bin/harper.js install

      - name: Run tests
        run: npm run test:unit:all

  # The vectorIndexPlane suite self-skips when the optional native artifact is absent, so
  # without this job nothing in CI would ever exercise the dual-write mirroring or the
  # native search cutover — green CI would only prove the JS path unchanged.
  hnsw-plane:
    name: HNSW native plane (Node.js v24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Build native hnsw-plane module
        run: npm run build:hnsw-plane

      - name: Crate tests
        run: cargo test --release --manifest-path native/hnsw-plane/Cargo.toml

      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'
        run: node --enable-source-maps ./dist/bin/harper.js install

      - name: Plane dual-write + parity tests
        run: npx mocha unitTests/resources/vectorIndexPlane.test.js
