name: Unit Test

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

jobs:
  unit-test:
    name: Unit Test (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ (github.event.inputs.node-version == 'all' || github.event.inputs.node-version == '') && fromJSON('[22, 24, 26]') || fromJSON(format('[{0}]', github.event.inputs.node-version)) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build segfault-handler binding (debug helper)
        run: npm rebuild segfault-handler || true

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'

        run: node --enable-source-maps ./dist/bin/harper.js install

      - name: Run tests
        env:
          HARPER_TEST_SEGFAULT_CAPTURE: /tmp/segfault-crash.log
        run: npm run test:unit:all

      - name: Upload segfault log
        if: failure() && matrix.node-version == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: segfault-log-node${{ matrix.node-version }}
          path: /tmp/segfault-crash.log
          if-no-files-found: warn
          retention-days: 7

      - name: Dump segfault log inline
        if: failure() && matrix.node-version == 24
        run: cat /tmp/segfault-crash.log 2>/dev/null || echo "(no crash log)"
