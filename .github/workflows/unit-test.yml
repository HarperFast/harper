name: Unit Test

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

jobs:
  unit-test:
    name: Unit Test (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ (github.event.inputs.node-version == 'all' || github.event.inputs.node-version == '') && fromJSON('[22, 24, 26]') || fromJSON(format('[{0}]', github.event.inputs.node-version)) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          NODE_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'info'

        run: node --enable-source-maps ./dist/bin/harper.js install

      - name: Enable core dumps (debug v24 segfault)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p.%t
          sudo sysctl -w kernel.core_uses_pid=1
          ulimit -c unlimited
          echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"
          echo "core_limit=$(ulimit -c)"

      - name: Run tests
        run: |
          ulimit -c unlimited
          npm run test:unit:all

      - name: Collect crash diagnostics
        if: always()
        run: |
          set +e
          echo "=== /tmp/cores listing ==="
          ls -la /tmp/cores/ 2>/dev/null
          echo "=== gdb backtraces ==="
          for core in /tmp/cores/core.*; do
            [ -f "$core" ] || continue
            echo "--- $core ---"
            # Extract executable from the core file metadata
            exe=$(file "$core" | grep -oE "from '[^']+'" | head -1 | sed "s/from '//; s/'$//" | awk '{print $1}')
            [ -z "$exe" ] && exe=$(which node)
            echo "exe=$exe"
            gdb --batch \
              --ex "set pagination off" \
              --ex "set print elements 0" \
              --ex "info threads" \
              --ex "thread apply all bt full" \
              "$exe" "$core" 2>&1 | head -500
          done
          echo "=== node version + native modules ==="
          node --version
          ls -la node_modules/@harperfast/rocksdb-js/dist/ 2>/dev/null | head -20
          ls -la node_modules/lmdb/prebuilds/*/ 2>/dev/null | head -20

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-cores-node${{ matrix.node-version }}
          path: |
            /tmp/cores/
          retention-days: 7
          if-no-files-found: warn
