# QA-145 — Version / ETag monotonicity under a same-record update storm.
#
# A plain @table (NOT @sealed) with audit ON so we can cross-check the audit-log
# timestamp against the REST ETag and the record's __updatedtime__. Each PUT/upsert
# of the same id is a plain set() (full replace, NOT addTo) — so lost-update under
# concurrency is EXPECTED; what we probe is the integrity of the VERSION metadata
# (lastModified -> ETag) across the storm: monotonicity, collision-freedom,
# final-state-is-a-real-submitted-value, and cross-surface consistency.
type Doc @table(audit: true) @export {
	id: ID @primaryKey
	value: Int
	tag: String
}
