# Record-lock concurrency fixture (harper#483): a plain counter row that every worker contends for.
type Counter @table @export {
	id: ID @primaryKey
	n: Int
	holders: Int
}

# Holds a request's mid-scope commit open on its blob save (harper#4080).
type CheckpointBlob @table {
	id: ID @primaryKey
	blob: Blob
}
