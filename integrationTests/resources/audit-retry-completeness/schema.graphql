# QA-552 — audit-log completeness under conflict-retry contention (#1773 isRetry-leak family).
#
# Hot: audit-enabled table, hammered on a SMALL keyspace (8 keys) by many concurrent PUTs so
# genuine RocksDB write-write conflicts (ERR_BUSY / coordinated RETRY_NOW) fire and force
# real conflict-retries through resources/DatabaseTransaction.ts. Fresh-key writes (unique id
# per request, always committed on the first attempt) are interleaved immediately after each
# contended write on the SAME pinned connection/worker, to reproduce the shape #1773's fix
# targeted: a retried write followed by a fresh write sharing transaction-object state.
type Hot @table(audit: true) @export {
	id: ID @primaryKey
	v: Int
	writer: String
}
