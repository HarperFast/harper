# QA-143 — schema evolution of @indexed / @relationship on a POPULATED table.
#
# This is the v0 (initial) schema. The test rewrites it live via set_component_file
# + restart_service http_workers to evolve indexes/relationships, then verifies the
# PRE-EXISTING (already-seeded) data behaves correctly after each evolution.
#
# Model: Author 1──* Book (Book.authorId).
#
# v0 deliberately:
#   - leaves Book.genre declared but NOT @indexed   (step 1 ADDs @indexed -> backfill)
#   - has NO Author.books / Book.author relationship (step 2 ADDs it -> resolve old rows)
#   - HAS Author.region @indexed and an Author.tagBooks relationship + Book.tag @indexed
#       (step 3 REMOVEs these -> ghost index / phantom edge check)
#   - stores Book.year as String                     (step 4 RETYPEs String->Int)

type Author @table @export {
	id: ID @primaryKey
	name: String
	region: String @indexed
	# tagBooks: a relationship present at v0 so step-3 can REMOVE it and probe phantom edges.
	tagBooks: [Book] @relationship(to: tag)
}

type Book @table @export {
	id: ID @primaryKey
	authorId: ID @indexed
	genre: String
	# tag: indexed at v0; the join key for Author.tagBooks. Step 3 REMOVEs this index.
	tag: ID @indexed
	year: String
	title: String
}
