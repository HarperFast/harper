# #1407/#1411 — custom-resource-handler over-time atomicity regression anchor.
#
# `Row` is written twice by the Handler resource below, once before and once after an idle
# `await` that outlives storage.maxTransactionOpenTime. `phase` lets the test tell the two
# writes apart when checking which (if either) survived.
type Row @table @export {
	id: ID @primaryKey
	phase: String
}
