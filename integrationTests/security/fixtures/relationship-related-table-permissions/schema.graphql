type Dept @table @export {
	id: ID @primaryKey
	name: String @indexed
	budget: Int @indexed
}

type Emp @table @export {
	id: ID @primaryKey
	name: String
	deptId: ID @indexed
	payload: Any
	dept: Dept @relationship(from: deptId)
}

type Seat @table @export {
	id: ID @primaryKey
	deptId: ID @indexed
	dept: Dept @relationship(from: deptId) @enumerable
}
