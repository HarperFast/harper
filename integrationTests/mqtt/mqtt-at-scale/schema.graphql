# QA-157 — MQTT broker at scale: many topics x many subscribers, wildcard
# fan-out, QoS-1 reconnect-backlog, per-subscription isolation.
#
# Device backs the topic space Device/<id>. We create MANY device ids (Device/0
# .. Device/N) and attach MANY concurrent MQTT subscribers:
#   - WILDCARD multi-level  Device/#   (must get EVERY Device/<id>)
#   - WILDCARD single-level Device/+   (must get every Device/<id>, one level)
#   - SPECIFIC topic        Device/7   (must get ONLY Device/7 — no cross-topic bleed)
# A burst publishes across all topics; a QoS-1 durable subscriber disconnects,
# the broker accumulates a backlog, and it reconnects to drain. A stalled
# subscriber probes per-subscription isolation (head-of-line blocking) and the
# broker's memory behavior under fan-out.
#
# value : per-publish counter / payload witness
# tag   : free-form marker
type Device @table @export {
	id: ID @primaryKey
	value: Int
	tag: String
}
