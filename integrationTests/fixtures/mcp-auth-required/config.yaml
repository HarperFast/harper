# `mcpAuthRequiredValidator` is wired in through HARPER_BUILTIN_COMPONENTS (see
# integrationTests/mcp/application-auth-required.test.ts); it must also appear as a top-level
# component key here for componentLoader to load it. It registers a Bearer validator that declares
# the protected-resource metadata URL the mount's 401 challenge names.
jsResource:
  files: resources.js
rest: true
mcpAuthRequiredValidator: true
