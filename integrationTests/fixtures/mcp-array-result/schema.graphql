# `Listing` exists only so @export generates the MCP CRUD verb tools, each of
# which advertises a derived object `outputSchema`. The resources.js subclass
# then returns an ARRAY from the record-scoped `get`, which is the shape that
# no object outputSchema can describe (#2754 review).
type Listing @table @export {
	id: ID @primaryKey
	name: String
}
