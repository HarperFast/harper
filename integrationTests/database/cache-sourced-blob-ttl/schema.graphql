# QA-738 — cache-sourced (sourcedFrom) Blob-valued table under short TTL: the uncovered corner
# is B=blob x C=ttl-expiration x E=cache-sourced (single-node). Prior blob/TTL QA waves
# (qa288-blob-ttl, qa306-expire-blob-unlink, qa672-blob-upgrade-ttl, qa543-cache-blob) all drive
# churn via a client-side PUT/PATCH endpoint against a plain @table(expiration:N) table — none
# use sourcedFrom(). qa220-sourced-cache covers sourcedFrom + TTL-refresh + stampede, but only
# for small scalar values, never a file-backed Blob.
#
# PageCache is sourcedFrom() a resolver (resources.js) that returns a fresh, deterministically
# DIFFERENT 200KB Blob (>> FILE_STORAGE_THRESHOLD=8192B, resources/blob.ts:68, so always
# file-backed) on every call. expiration:3s means every read against an absent/expired entry
# takes the ensureLoadedFromSource -> getFromSource revalidation path (resources/Table.ts
# ~5099-5151, ~5300+), a code path none of the direct-write blob/TTL tests exercise.

type PageCache @table(expiration: 3) @sealed @export {
	id: ID @primaryKey
	data: Blob
	version: Int
	sha256: String
}

# Internal bookkeeping table (not part of the coverage cell under test): resources.js
# module-level JS state (plain Maps) is per-HTTP-worker-thread-local, NOT shared across workers
# (each worker loads its own module isolate) — confirmed empirically (an in-memory call counter
# reset to 0 depending on which worker served a request). This table's storage IS coherent
# across workers (same underlying RocksDB store), so it's used instead for genuinely shared
# resolver-call counting and one-shot artificial-delay control.
type ResolverCalls @table @sealed @export {
	id: ID @primaryKey
	count: Int
	delayMs: Int
}
