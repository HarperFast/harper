# QA-180 — Blob unlink-timer vs record-delete-commit ordering under a CRASH (SIGKILL).
#
# Sharper than QA-174 (graceful force-commit): this targets the CRASH window in the
# expiration sweep's unlink-then-commit sequence. removeEntry() (RecordEncoder.ts:839)
# does deleteBlobsInObject(value) FIRST — which schedules a decoupled setTimeout unlink
# of the blob FILE ~deletionDelay(=500ms) later (blob.ts:499) — and only THEN
# store.remove(key) queues the record delete into the per-eviction DatabaseTransaction.
#
# A SIGKILL while the sweep is unlinking-and-committing can land in either gap:
#   (a) the unlink timer FIRED (file gone) but the record delete did NOT durably commit
#       -> on restart the record is back / still live but its blob file is missing
#          == ORPHANED-REF (live record, unreadable blob = silent data loss), or
#   (b) the record delete DID durably commit but the 500ms unlink timer never fired
#       before the crash -> a blob FILE on disk with no referencing record
#          == ORPHANED-FILE (leak).
#
# BlobExpire — short TTL (6s) + required file-backed Blob. The expiration sweep evicts
#   these; we SIGKILL mid-sweep.
# BlobKeep   — no-TTL control: its blobs must survive a crash byte-exact (no wrong-file
#   unlink, no crash-induced loss of a record that was never supposed to be evicted).

type BlobExpire @table(expiration: 6) @sealed @export {
    id: ID! @primaryKey
    data: Blob!
    sha256: String
    size: Int
}

type BlobKeep @table @sealed @export {
    id: ID! @primaryKey
    data: Blob!
    sha256: String
    size: Int
}
