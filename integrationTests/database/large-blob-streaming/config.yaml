# QA-144 — Large-blob storage limits + streaming upload/download correctness.
#
# Big: a durable blob table holding genuinely large (256MB+) blobs. The
# BlobOps resource generates blob bytes via an async generator (chunked, never
# the whole blob in the worker heap), saves them through createBlob's streaming
# source path, and reads them back through blob.stream() with a running hash —
# so neither upload nor download server-side requires buffering the full blob.
graphqlSchema:
  files: '*.graphql'
jsResource:
  files: resources.js
rest: true
