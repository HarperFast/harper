# QA-632 — mechanism boundaries of F-158 (GH #1881), RocksDB secondary-index scan miss
# once a table's rows span >1 on-disk sorted run. Dedicated "f158-bounds" database.
#
# MinRepro / MinReproB: identical minimal shape (id @primaryKey, repositoryId @indexed,
# n @indexed, body). MinRepro is the primary instrument for the minimal-repro sweep
# (question 1, self-repeat reads). MinReproB is a small second table used only for the
# cross-table order check and as an upsert-guard "decoy" first read (question 1b, question 3).
type MinRepro @table(database: "f158bounds") @export {
	id: ID @primaryKey
	repositoryId: String @indexed
	n: Int @indexed
	body: String
}

type MinReproB @table(database: "f158bounds") @export {
	id: ID @primaryKey
	repositoryId: String @indexed
	n: Int @indexed
	body: String
}
